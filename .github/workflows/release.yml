name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RMAIL_GOOGLE_CLIENT_ID: ${{ secrets.RMAIL_GOOGLE_CLIENT_ID }}
  RMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.RMAIL_GOOGLE_CLIENT_SECRET }}

jobs:
  windows:
    name: Windows (portable + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (NSIS installer)
        run: npm run tauri build -- --bundles nsis

      - name: Package portable zip and installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $dest = "RMail-$version-windows-x64-portable"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item src-tauri/target/release/rmail.exe "$dest/RMail.exe"
          Compress-Archive -Path "$dest/*" -DestinationPath "$dest.zip"
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "RMail-$version-windows-x64-setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            RMail-*-windows-x64-portable.zip
            RMail-*-windows-x64-setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: RMail ${{ github.ref_name }}
          files: |
            RMail-*-windows-x64-portable.zip
            RMail-*-windows-x64-setup.exe
          fail_on_unmatched_files: true

  macos:
    name: macOS universal (portable + DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build universal app bundle and DMG
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Package portable zip and DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          ditto -c -k --sequesterRsrc --keepParent \
            "$bundle/macos/RMail.app" \
            "RMail-${version}-macos-universal-portable.zip"
          cp "$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n1)" "RMail-${version}-macos-universal.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            RMail-*-macos-universal-portable.zip
            RMail-*-macos-universal.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: RMail ${{ github.ref_name }}
          files: |
            RMail-*-macos-universal-portable.zip
            RMail-*-macos-universal.dmg
          fail_on_unmatched_files: true

  linux:
    name: Linux (AppImage + deb + rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev

      - run: npm ci

      - name: Build AppImage, deb and rpm
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Rename packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=src-tauri/target/release/bundle
          pick() { find "$bundle/$1" -maxdepth 1 -name "$2" | head -n1; }
          cp "$(pick appimage '*.AppImage')" "RMail-${version}-linux-x86_64.AppImage"
          cp "$(pick deb '*.deb')" "RMail-${version}-linux-amd64.deb"
          cp "$(pick rpm '*.rpm')" "RMail-${version}-linux-x86_64.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            RMail-*-linux-x86_64.AppImage
            RMail-*-linux-amd64.deb
            RMail-*-linux-x86_64.rpm

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: RMail ${{ github.ref_name }}
          files: |
            RMail-*-linux-x86_64.AppImage
            RMail-*-linux-amd64.deb
            RMail-*-linux-x86_64.rpm
          fail_on_unmatched_files: true

  publish:
    name: Publish release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build release notes from commit history
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file release-notes.md --draft=false --repo "${{ github.repository }}"
