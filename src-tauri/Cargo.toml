[package]
name = "rmail"
version = "0.1.19"
description = "A lightweight desktop email client."
edition = "2024"
default-run = "rmail"

[lib]
name = "rmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6.0", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3.31"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
tokio = { version = "1", features = ["rt", "net", "time", "fs", "io-util", "sync"] }
mailparse = "0.16.1"
ammonia = "4.1.4"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
keyring = "4.1.6"
tauri-plugin-notification = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "rustls"] }
base64 = "0.23.1"
sha2 = "0.11.0"
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v4"] }
open = "5.4.1"
utf7-imap = "0.3.2"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
