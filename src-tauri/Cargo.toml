[package]
name = "rmail"
version = "0.1.0"
description = "A lightweight desktop email client."
edition = "2021"

[lib]
name = "rmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tauri-plugin-stronghold = "2"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6.0", default-features = false, features = ["runtime-tokio"] }
futures-util = "0.3.31"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1-native-tls"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
mailparse = "0.16.1"
ammonia = "4.1.4"

[profile.dev.package.scrypt]
opt-level = 3
